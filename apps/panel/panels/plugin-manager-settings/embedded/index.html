<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Plugin Manager Settings</title>
        <link rel="stylesheet" href="./index.css" />
    </head>
    <body>
        <main id="pluginManagerSettingsRoot" class="workbench reference-workbench">
            <header class="workbench-topbar">
                <div class="workbench-tabs"><span class="workbench-tab">已安装扩展</span><span class="workbench-tab">远程扩展</span><span class="workbench-tab">关于</span></div>
                <div class="workbench-toolbar"><div class="workbench-brand"><span class="workbench-kicker">Peanut · Cocos</span><strong>插件管理器</strong></div><span id="settingsStatus" class="pill pill-neutral">Loading…</span></div>
            </header>
            <div class="workbench-panel">
                <aside class="sidebar-pane"><section class="pane-section pane-section-fill"><div class="pane-heading"><div><p class="eyebrow">管理器设置</p><h2>偏好设置</h2></div></div><p class="section-copy">管理 Plugin Manager 的显示和默认目录视图。</p></section></aside>
                <section class="runtime-main"><header class="reference-view-heading"><div><p class="eyebrow">设置</p><h1>Plugin Manager Settings</h1><p class="section-copy">保存后将在下次打开管理器时生效。</p></div></header>
                    <form id="settingsForm" class="detail-pane scroll-pane">
                        <section class="detail-card"><span class="detail-label">Display</span><h2>Language</h2><label class="settings-field" for="settingsLocale"><span>Language</span><select id="settingsLocale" class="package-select" name="locale"><option value="en-US">English</option><option value="zh-CN">简体中文</option></select></label></section>
                        <section class="detail-card"><span class="detail-label">Package Catalog</span><h2>Default View</h2><label class="settings-field" for="settingsPackageFilter"><span>Default filter</span><select id="settingsPackageFilter" class="package-select" name="packageFilter"><option value="all">All sources</option><option value="installed">Installed</option><option value="not-installed">Not installed</option><option value="upgrade">Upgrade candidates</option></select></label><label class="settings-field" for="settingsPackageSort"><span>Default sort</span><select id="settingsPackageSort" class="package-select" name="packageCatalogSort"><option value="plugin-id-asc">Plugin ID A–Z</option><option value="plugin-id-desc">Plugin ID Z–A</option><option value="source-asc">Source A–Z</option><option value="recent-first">Recent first</option></select></label></section>
                        <p id="settingsError" class="detail-note" role="alert" hidden></p><footer class="action-bar"><button id="resetSettingsButton" type="button" class="button button-ghost">Restore Defaults</button><button id="reloadSettingsButton" type="button" class="button button-ghost">Cancel</button><button id="saveSettingsButton" type="submit" class="button button-primary">Save</button></footer>
                    </form>
                </section>
            </div>
        </main>
        <script src="./index.js"></script>
    </body>
</html>
